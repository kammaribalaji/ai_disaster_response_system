<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Disaster Response System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #070b14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Gradient Background ── */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.06) 0%, transparent 60%),
                        linear-gradient(135deg, #070b14 0%, #0f172a 100%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0%   { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(20deg); }
        }

        /* ── Canvas Particles (fallback visible bg) ── */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ── Glowing orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: orbFloat 8s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(59,130,246,0.12); top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: rgba(139,92,246,0.1); bottom: -10%; right: -10%; animation-delay: -4s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(6,182,212,0.08); top: 40%; left: 60%; animation-delay: -2s; }
        @keyframes orbFloat {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, -30px) scale(1.05); }
        }

        /* ── Login Card — Glassmorphism ── */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 42px 40px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5), 
                        inset 0 1px 0 rgba(255,255,255,0.12);
            animation: cardIn 0.6s cubic-bezier(0.34,1.4,0.64,1) forwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Brand ── */
        .brand-icon {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 24px rgba(59,130,246,0.4);
            font-size: 1.5rem;
            color: white;
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }

        .brand-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-align: center;
        }
        .brand-sub {
            color: rgba(255,255,255,0.45);
            font-size: 0.82rem;
            text-align: center;
            margin-top: 4px;
        }

        /* ── Role Tabs ── */
        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 24px 0 18px 0;
        }
        .role-tab {
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: rgba(255,255,255,0.5);
            font-size: 0.78rem;
            font-weight: 600;
        }
        .role-tab .tab-icon { font-size: 1.5rem; display: block; margin-bottom: 5px; }
        .role-tab:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.8); transform: translateY(-2px); }
        .role-tab.active {
            background: rgba(59,130,246,0.2);
            border-color: rgba(59,130,246,0.5);
            color: #93c5fd;
            box-shadow: 0 0 20px rgba(59,130,246,0.2);
            transform: translateY(-2px);
        }

        /* ── Role Desc Banner ── */
        .role-desc {
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #93c5fd;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.55);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap .input-icon {
            position: absolute;
            left: 13px;
            color: rgba(255,255,255,0.3);
            font-size: 1rem;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 11px 14px 11px 40px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            outline: none;
        }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
        .input-wrap input:focus {
            border-color: rgba(59,130,246,0.7);
            background: rgba(59,130,246,0.08);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .eye-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            transition: color 0.2s;
        }
        .eye-btn:hover { color: rgba(255,255,255,0.7); }

        /* ── Submit ── */
        .btn-signin {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            padding: 13px;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(59,130,246,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-signin::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.3s ease;
        }
        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59,130,246,0.5);
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        .btn-signin:active::after { background: rgba(255,255,255,0.15); }
        .btn-signin:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* ── Footer ── */
        .login-footer {
            margin-top: 20px;
            text-align: center;
            color: rgba(255,255,255,0.25);
            font-size: 0.75rem;
        }

        /* ── Demo hint ── */
        .demo-hint {
            margin-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 14px;
        }
        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 5px 10px;
            color: rgba(255,255,255,0.35);
            font-size: 0.72rem;
            font-weight: 600;
        }

        /* ── Loading spinner ── */
        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 30px 22px; margin: 16px; border-radius: 20px; }
            .role-tab { padding: 10px 4px; font-size: 0.72rem; }
            .tab-icon { font-size: 1.3rem !important; }
        }
    </style>
</head>
<body>

<!-- Background Layers -->
<div class="bg-gradient"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="particleCanvas"></canvas>

<!-- Login Card -->
<div class="login-card">
    <!-- Brand -->
    <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
    <div class="brand-title">Disaster OS</div>
    <div class="brand-sub">AI-Powered Emergency Response System</div>

    <!-- Role Tabs -->
    <div class="role-tabs">
        <div class="role-tab active" id="tab-admin" onclick="selectRole('admin')">
            <span class="tab-icon">👨‍💼</span>Admin
        </div>
        <div class="role-tab" id="tab-rescue" onclick="selectRole('rescue')">
            <span class="tab-icon">🚑</span>Rescue
        </div>
        <div class="role-tab" id="tab-public" onclick="selectRole('public')">
            <span class="tab-icon">👥</span>Public
        </div>
    </div>

    <!-- Role Description -->
    <div class="role-desc" id="roleDesc">
        <i class="bi bi-shield-fill-check"></i>
        <span id="roleDescText">Full system control — analytics, resources, simulations</span>
    </div>

    <!-- Error Message -->
    {% if error %}
    <div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; color: #fca5a5; font-size: 14px; display: flex; gap: 8px; align-items: center;">
        <i class="bi bi-exclamation-circle"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Form -->
    <form id="loginForm" method="POST" action="/login" autocomplete="off">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrap">
                <i class="bi bi-person input-icon"></i>
                <input type="text" id="usernameInput" name="username" placeholder="Enter username" required>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" id="passwordInput" name="password" placeholder="Enter password" required>
                <button type="button" class="eye-btn" onclick="togglePwd()">
                    <i class="bi bi-eye-slash" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-signin" id="signinBtn">
            <i class="bi bi-box-arrow-in-right"></i>
            <span id="signinLabel">Sign In</span>
        </button>
    </form>

    <div class="demo-hint text-center">
        <span class="demo-badge"><i class="bi bi-info-circle"></i> Demo — click a role to auto-fill credentials</span>
    </div>

    <div class="login-footer">
        <i class="bi bi-shield-lock me-1"></i> Encrypted · Role-Based Access Control
    </div>
</div>

<script>
/* ── Particle System ─────────────────────────────────────── */
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.4 + 0.1;
    }
    update() {
        this.x += this.speedX; this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(148,163,184,${this.opacity})`;
        ctx.fill();
    }
}

for (let i = 0; i < 120; i++) particles.push(new Particle());

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Draw connecting lines
    for (let i = 0; i < particles.length; i++) {
        for (let j = i+1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 90) {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(59,130,246,${0.07 * (1-dist/90)})`;
                ctx.lineWidth = 0.5;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
        particles[i].update();
        particles[i].draw();
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

/* ── Role Logic ─────────────────────────────────────────── */
const roleConfig = {
    admin:  { user:'admin',      pass:'admin123',    desc:'Full system control — analytics, resources, simulations', icon:'bi-shield-fill-check', redirect:'/admin-dashboard'   },
    rescue: { user:'rescue_team', pass:'rescue123', desc:'Action tools — routes, live alerts, field operations',    icon:'bi-truck',              redirect:'/rescue-dashboard'  },
    public: { user:'public_user', pass:'public123',  desc:'Safety info — risk zones, shelters, emergency report',    icon:'bi-person-check-fill',  redirect:'/public-dashboard'  }
};

let currentRole = 'admin';

function selectRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-'+role).classList.add('active');
    const cfg = roleConfig[role];
    document.getElementById('roleDescText').textContent = cfg.desc;
    document.getElementById('roleDesc').querySelector('i').className = `bi ${cfg.icon}`;
    document.getElementById('usernameInput').value = cfg.user;
    document.getElementById('passwordInput').value = cfg.pass;
}

function togglePwd() {
    const inp = document.getElementById('passwordInput');
    const ico = document.getElementById('eyeIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ico.className = inp.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
}

function handleLogin(e) {
    const btn = document.getElementById('signinBtn');
    const label = document.getElementById('signinLabel');
    btn.disabled = true;
    label.textContent = 'Signing in…';
    btn.insertAdjacentHTML('afterbegin', '<div class="spinner"></div>');
}

// Init
selectRole('admin');
</script>
</body>
</html>
